name: Idea or improvement
description: Suggest a system, mechanic or change
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: |
        The problem matters more than the solution. Describing the situation in
        which the lack of this hurts helps more than describing the finished feature.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you propose

  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - RP mechanic (gameplay)
        - Staff / moderation tool
        - Infrastructure or performance
        - Interface (in-game or panel)
        - Documentation
    validations:
      required: true

  - type: checkboxes
    id: authority
    attributes:
      label: Server authority
      description: |
        The project's golden rule is that the server decides and the client displays
        (see [MODDING_GUIDELINES](../blob/main/docs/MODDING_GUIDELINES.md)).
        A proposal that depends on the client deciding something needs a different
        design.
      options:
        - label: The proposal keeps the decision on the server
        - label: Not sure — I want to discuss it
