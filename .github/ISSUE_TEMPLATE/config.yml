# Issues are for bugs and concrete proposals. Questions, loose ideas and help
# requests go to Discussions — it keeps the tracker clean and the conversation in
# a place where other people can find the answer later.
blank_issues_enabled: false

contact_links:
  - name: Question or help request
    url: https://github.com/vinicius3232/skymp-heavy-rp/discussions/categories/q-a
    about: Could not get the server running, a question about the SkyMP API, or something you did not understand in the docs. Ask here — the answer stays visible to whoever comes next.

  - name: Idea or design discussion
    url: https://github.com/vinicius3232/skymp-heavy-rp/discussions/categories/ideas
    about: An RP mechanic idea, an architecture suggestion, or something you want to discuss before it becomes a proposal.

  - name: Show what you made
    url: https://github.com/vinicius3232/skymp-heavy-rp/discussions/categories/show-and-tell
    about: Ran a server on this base? Built a module? Tell us — it becomes a reference for the community.

  - name: Security flaw
    url: https://github.com/vinicius3232/skymp-heavy-rp/security/advisories/new
    about: Do NOT open a public issue or discussion. Use the private Security Advisory channel.

  - name: Documentation
    url: https://github.com/vinicius3232/skymp-heavy-rp/blob/main/README.md
    about: Start with the README (README, CONTRIBUTING and SECURITY are the entry points). If a specific document blocks you, ask in Discussions.
