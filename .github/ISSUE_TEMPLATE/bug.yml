name: Bug
description: Something does not work the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before opening: if this is a **security flaw**, do not use this form —
        see [SECURITY.md](../blob/main/SECURITY.md).

  - type: dropdown
    id: service
    attributes:
      label: Where it happens
      options:
        - gamemode (in game)
        - web panel (apps/web)
        - game API / queue (apps/game-api)
        - Discord bot
        - launcher
        - database / migrations
        - not sure
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: If there is an error message or log, paste it here.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      placeholder: |
        1. Turned on ENABLE_GOVERNANCE_SERVICE=true
        2. Joined with two players
        3. Arrested the other one through the guard interaction menu
        4. ...

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        Node: v20.x
        Database: MariaDB 11
        ENABLE_* flags on: governance, market-stalls
        Commit: a16670e

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: I checked the [QA_REPORT](../blob/main/docs/technical/QA_REPORT_2026-08.md) — it may already be documented as known
        - label: I did not paste any secret, token or password above
