# Launcher installer build, signed when a certificate is available.
#
# Kept separate from `ci.yml` on purpose. CI runs on `ubuntu-latest` on every push and
# needs to be fast; this runs on `windows-latest` (`signtool` is Windows-only),
# takes minutes and only makes sense on a tag or on demand.
#
# ─── What this workflow proves, and what it does not ─────────────────────────
#
# It **proves** that the installer is produced, and — when the secrets exist — that the
# signature was applied and is valid (the verification step uses `Get-AuthenticodeSignature`).
#
# It does **not prove** that SmartScreen lets it through. SmartScreen reputation is
# built by Microsoft over many downloads, and the only way to check is to
# download the installer on a clean machine and see what Windows says. That is
# recorded as a manual step in `docs/technical/LAUNCHER_DISTRIBUTION.md` §6 and
# **cannot be run here**.
name: Launcher — build and signing

on:
  push:
    tags:
      - 'launcher-v*'
  workflow_dispatch:

jobs:
  build:
    name: Windows installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/launcher/package-lock.json

      - name: Install dependencies
        working-directory: apps/launcher
        run: npm ci

      # The build is not the place to discover type errors — but if CI's typecheck
      # did not run on this ref (tag pushed directly), running it here is cheap.
      - name: Typecheck
        working-directory: apps/launcher
        run: npm run typecheck

      # Says loud and clear whether this build will come out signed or not. Without it,
      # an unsigned installer goes unnoticed until a player complains about
      # SmartScreen — which is weeks later and far from here.
      - name: Is there a certificate in this environment?
        id: cert
        shell: bash
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
        run: |
          if [ -n "$CSC_LINK" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Certificate present: the installer comes out SIGNED."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::WINDOWS_CSC_LINK missing. The installer comes out UNSIGNED and SmartScreen will block it. See LAUNCHER_DISTRIBUTION.md section 6."
          fi

      # `CSC_LINK` and `CSC_KEY_PASSWORD` are read by electron-builder itself;
      # nothing in `electron-builder.json` points to the certificate, and that is
      # how it should be. When they are missing, it builds the installer unsigned and
      # warns in the log — which is what keeps contributor builds working.
      - name: Build
        working-directory: apps/launcher
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: npm run build

      # Real verification, not "the file exists". `Get-AuthenticodeSignature`
      # returns `Valid` only when the chain closes and the timestamp is there.
      #
      # Fails the job when there was a certificate and the signature did not stick: an
      # installer that comes out unsigned from a build that should sign is worse
      # than a broken build, because it looks like it worked.
      - name: Verify the signature
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path apps/launcher/dist-electron -Filter *.exe -Recurse |
                 Where-Object { $_.Name -like '*Setup*' } |
                 Select-Object -First 1
          if (-not $exe) { Write-Error 'No installer was produced.'; exit 1 }
          Write-Host "Installer: $($exe.FullName)"

          $sig = Get-AuthenticodeSignature $exe.FullName
          Write-Host "Status: $($sig.Status)"
          Write-Host "Signer: $($sig.SignerCertificate.Subject)"
          Write-Host "Timestamp: $($sig.TimeStamperCertificate.Subject)"

          if ('${{ steps.cert.outputs.signed }}' -eq 'true') {
            if ($sig.Status -ne 'Valid') {
              Write-Error "There was a certificate and the signature is not valid (status: $($sig.Status))."
              exit 1
            }
            if (-not $sig.TimeStamperCertificate) {
              # Without a timestamp, every installer already distributed becomes an "invalid
              # signature" on the day the certificate expires — including the ones
              # players downloaded months earlier.
              Write-Error 'Signed without a timestamp. See timeStampServer in electron-builder.json.'
              exit 1
            }
            Write-Host 'OK: signed and timestamped.'
          } else {
            Write-Host '::warning::Installer NOT signed (no certificate in the environment). Do not distribute.'
          }

      - name: Publish the installer as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: launcher-installer
          path: apps/launcher/dist-electron/*.exe
          if-no-files-found: error
          # Short on purpose: a CI artifact is not a distribution channel. The
          # channel is GitHub Releases (LAUNCHER_DISTRIBUTION.md §2).
          retention-days: 14
