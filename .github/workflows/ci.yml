# CI — runs everything that can run without Skyrim and without a database.
#
# What THIS workflow does NOT cover, and it is good to be clear about it: none of
# the in-game behavior. The gamemode tests use a mocked `mp`, and a mock accepts
# anything — that is how 22 Papyrus calls with wrong arguments went months
# with a green suite. Green CI here means "did not break what was already
# verified", not "works in game".
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual trigger (`gh workflow run CI --ref main` or the "Run workflow" button
  # in the Actions tab). It exists because `push` and `pull_request` do not always fire:
  # when the merge is done through the API with an OAuth app token, GitHub does not
  # create the event, and the commit lands on main with no check run attached —
  # that is what happened with PRs #2 and #3, which went in verified only by
  # local runs. Without this trigger there is no way to ask for the check afterwards,
  # because `workflow_dispatch` is the only way to invoke a workflow by hand.
  workflow_dispatch:

# A PR that gets several pushes in a row cancels the old runs instead of
# queueing them — faster feedback and fewer wasted runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      # Do not stop the other services when one fails: it is better to see all
      # the problems at once than to discover one per run.
      fail-fast: false
      matrix:
        include:
          - name: gamemode
            dir: skymp/gamemode
          - name: web panel
            dir: apps/web
          - name: game api
            dir: apps/game-api
          - name: discord bot
            dir: apps/bot-discord
          - name: launcher
            dir: apps/launcher

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.dir }}
        run: npm ci

      - name: Tests
        working-directory: ${{ matrix.dir }}
        run: npm test

  gamemode-extras:
    name: gamemode — checks and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: skymp/gamemode/package-lock.json

      - name: Install dependencies
        working-directory: skymp/gamemode
        run: npm ci

      # Checks migrations, required commands, permissions and environment flags.
      - name: System checks
        working-directory: skymp/gamemode
        run: npm run test:systems

      # No database in CI, so the real schema cannot be compared. What can be
      # guaranteed here is that the parser still understands the migrations: if
      # a new migration used a DDL form it does not recognize, it would
      # start approving an incomplete database — a silent failure, which is
      # exactly what the checker exists to prevent.
      - name: Schema declared by the migrations is readable
        working-directory: skymp/gamemode
        run: npm run check:schema:list

      # Informational: validates use of the `mp` API against types/mp.d.ts. Errors coming
      # from inside node_modules/ws are known noise, so we filter them out.
      - name: Typecheck (informational)
        working-directory: skymp/gamemode
        continue-on-error: true
        run: |
          npm run typecheck 2>&1 | grep -v '^node_modules' || true

  launcher:
    name: launcher — typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/launcher/package-lock.json

      - name: Install dependencies
        working-directory: apps/launcher
        run: npm ci

      # `tsc -b` and not `tsc`: the root tsconfig.json is a solution file with
      # `files: []`, so `tsc` alone checks no project at all.
      - name: Typecheck
        working-directory: apps/launcher
        run: npm run typecheck

  hygiene:
    name: repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The registry of patches to SkyMP. No dependencies, so it runs here and not
      # in the matrix with `npm ci`. A half-registered patch looks like control
      # and is not — see patches/README.md.
      - name: Patch registry is valid
        run: |
          node patches/validate.js
          node --test patches/validate.test.js

      # .gitignore covers .env, but a file already tracked before the rule
      # would stay versioned. This check is cheap and the cost of getting it wrong is high.
      - name: No versioned .env
        run: |
          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(local|production|staging)$'; then
            echo "::error::Versioned .env file. Secrets do not go into the repository."
            exit 1
          fi
          echo "OK: no tracked .env."

      # We never redistribute Bethesda assets — the player must own the game.
      - name: No Bethesda assets
        run: |
          if git ls-files | grep -iE '\.(esm|bsa)$'; then
            echo "::error::Versioned master or BSA. See LICENSE_AND_AFFILIATION_POLICY.md."
            exit 1
          fi
          echo "OK: no Bethesda assets."

      - name: Production configuration auditor
        run: node --test scripts/check-production-config.test.js scripts/run-service-soak.test.js

  # Checks that every registered patch still applies cleanly on top of the commit
  # pinned in patches/manifest.json.
  #
  # Runs in its own job because it needs to clone upstream (~53 MB), and **exits early
  # when there is no patch**: cloning to verify zero diffs burns runner minutes
  # to produce the same answer every day. Today it always exits early, and
  # that is the preferred situation — see patches/README.md.
  #
  # `git apply --check` and not `git apply`: it answers "would it apply in full?" without
  # writing anything. It is the "never silently apply half a patch" of
  # briefing §12, and it comes for free.
  patches-apply:
    name: patches still apply upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Is there a registered patch?
        id: check
        run: |
          n=$(node -e 'process.stdout.write(String(require("./patches/manifest.json").patches.length))')
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "pin=$(node -e 'process.stdout.write(require("./patches/manifest.json").upstream.pin || "")')" >> "$GITHUB_OUTPUT"
          if [ "$n" = "0" ]; then
            echo "No registered patch — nothing to verify."
          fi

      - name: Clone SkyMP at the pinned commit
        if: steps.check.outputs.count != '0'
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/skyrim-multiplayer/skymp.git /tmp/upstream-skymp
          cd /tmp/upstream-skymp
          # A failure here means the pin points to a commit that no longer
          # exists — upstream history rewrite, or a typo.
          git checkout --detach "${{ steps.check.outputs.pin }}"

      - name: git apply --check on each patch
        if: steps.check.outputs.count != '0'
        run: |
          failed=0
          for f in $(node -e '
            const m = require("./patches/manifest.json");
            process.stdout.write(m.patches.map(p => p.file).join("\n"));
          '); do
            if git -C /tmp/upstream-skymp apply --check "$GITHUB_WORKSPACE/patches/$f"; then
              echo "OK: $f"
            else
              echo "::error file=patches/$f::does not apply on ${{ steps.check.outputs.pin }}. Re-evaluate the patch before patching it up — upstream may have fixed the problem."
              failed=1
            fi
          done
          exit $failed
